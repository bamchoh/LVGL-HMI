name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC, sdl)
            os: windows-latest
            # same as build.cmd: SDL2 built from source, OPC UA + designer on
            cmake_args: ''
          - name: Linux (gcc, fbdev)
            os: ubuntu-latest
            # fbdev needs no extra packages; designer is off on Linux by default
            cmake_args: -DHML_BACKEND=fbdev

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # Dependencies are fetched by CMake (FetchContent) into build/_deps; cache the downloaded
      # sources so a run only has to download when CMakeLists.txt changes.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'tools/designer/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build unit tests
        run: cmake --build build --target hml_tests

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build everything (runtime, designer)
        run: cmake --build build

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ runner.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
